---
galaxy_info:
  author: Mullholland
  namespace: mullholland
  role_name: repository_powertools
  description: Enables the PowerTools/CodeReady Builder (CRB) repository on CentOS Stream, Rocky Linux and AlmaLinux
  license: MIT
  company: none
  min_ansible_version: "2.10"

  # Ansible Galaxy's platform schema has no entry for CentOS specifically
  # (only the generic "EL" umbrella) - this role's actual CentOS support is
  # still exercised via molecule, it just cannot be declared here.
  platforms:
    - name: Rocky
      versions:
        - all
    - name: AlmaLinux
      versions:
        - all
  galaxy_tags:
    - development
    - packaging
    - system

dependencies: []
# List your role dependencies here, one per line. Be sure to remove the '[]' above,
# if you add dependencies to this list.
